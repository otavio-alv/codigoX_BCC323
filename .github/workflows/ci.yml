name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codigox
          POSTGRES_USER: codigox
          POSTGRES_PASSWORD: codigox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codigox -d codigox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "False"
      SECRET_KEY: chave-usada-somente-no-ci-nao-e-segredo
      DATABASE_URL: postgres://codigox:codigox@localhost:5432/codigox

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Gerar o CSS
        run: npm run build:css

      - name: Conferir migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes
        run: python manage.py test
