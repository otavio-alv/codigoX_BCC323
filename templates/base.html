{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block titulo %}Jornada Código X{% endblock %} · Código X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head_extra %}{% endblock %}
</head>
<body class="flex min-h-screen flex-col bg-codigo-fundo">
  {% block cabecalho %}{% endblock %}

  <main id="conteudo" class="flex-1">
    {% block conteudo %}{% endblock %}
  </main>

  <script src="{% static 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
